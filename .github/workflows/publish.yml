name: Release

on:
  push:
    branches:
      - main

permissions: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.14'
          registry-url: 'https://registry.npmjs.org/'

      - name: Check NPM_TOKEN availability
        id: npm_token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "${NPM_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "NPM_TOKEN is set; semantic-release will publish to npm."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=NPM_TOKEN not set::Skipping semantic-release. Set the NPM_TOKEN repository secret to enable npm publishing."
          fi

      - name: Install pinned toolchain
        if: steps.npm_token.outputs.available == 'true'
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Build
        if: steps.npm_token.outputs.available == 'true'
        run: npm run build

      - name: Test
        if: steps.npm_token.outputs.available == 'true'
        run: npm test

      - name: Release
        if: steps.npm_token.outputs.available == 'true'
        run: npx --no-install semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
